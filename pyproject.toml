[project]
name = "glasslite"
version = "0.1.0"
description = "Local screen/audio capture -> Whisper -> SQLite, exposed to Claude Code via MCP"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.11",
  "mcp>=2.3,<3",
  "mss>=9",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4", "faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
glasslite = "glasslite.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["glasslite"]
