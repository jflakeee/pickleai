[project]
name = "glasslite"
version = "0.1.0"
description = "Local screen/audio capture -> Whisper -> SQLite, queried by Claude Code via CLI/Skill (MCP optional)"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.11",
  "mss>=9",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4", "faster-whisper>=1.0"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "mcp>=2.3,<3"]

[project.scripts]
glasslite = "glasslite.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["glasslite"]

[tool.setuptools.package-data]
glasslite = ["skill/SKILL.md"]
